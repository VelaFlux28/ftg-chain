syntax = "proto3";
package ftgchain.burn.v1;

option go_package = "github.com/VelaFlux28/ftg-chain/x/burn/types";

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

// MerchantBurnData contains details specific to Automatic Merchant Protocol burns
message MerchantBurnData {
  string energy_revenue_usd = 1 [(cosmos_proto.scalar) = "cosmos.Dec"];
  string dex_purchase_price = 2 [(cosmos_proto.scalar) = "cosmos.Dec"];
  string vault_id = 3;
  string grid_operator = 4;
}

// BurnEvent records a token burn on-chain
message BurnEvent {
  string burn_id = 1;
  string amount = 2 [(cosmos_proto.scalar) = "cosmos.Int"];
  string source = 3;
  string sender = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  google.protobuf.Timestamp timestamp = 5 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  string tx_hash = 6;
  MerchantBurnData merchant_data = 7;
}

// BurnStats tracks cumulative burn statistics
message BurnStats {
  string total_burned = 1 [(cosmos_proto.scalar) = "cosmos.Int"];
  uint64 total_burn_events = 2;
  string merchant_protocol_burned = 3 [(cosmos_proto.scalar) = "cosmos.Int"];
  string manual_burned = 4 [(cosmos_proto.scalar) = "cosmos.Int"];
  string redemption_burned = 5 [(cosmos_proto.scalar) = "cosmos.Int"];
  string total_energy_revenue_usd = 6 [(cosmos_proto.scalar) = "cosmos.Dec"];
}

// Params defines the parameters for the burn module
message Params {
  bool merchant_protocol_enabled = 1;
  string merchant_burn_percentage = 2 [(cosmos_proto.scalar) = "cosmos.Dec"];
  string min_burn_amount = 3 [(cosmos_proto.scalar) = "cosmos.Int"];
  repeated string authorized_merchant_addresses = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// GenesisState defines the burn module's genesis state
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated BurnEvent burn_events = 2 [(gogoproto.nullable) = false];
  BurnStats stats = 3 [(gogoproto.nullable) = false];
}
