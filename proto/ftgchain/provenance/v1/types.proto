syntax = "proto3";
package ftgchain.provenance.v1;

option go_package = "github.com/VelaFlux28/ftg-chain/x/provenance/types";

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

// EnergySource describes where the energy came from
message EnergySource {
  string type = 1;
  string provider = 2;
  string location = 3;
  google.protobuf.Timestamp generation_period_start = 4 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  google.protobuf.Timestamp generation_period_end = 5 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  string mwh_quantity = 6 [(cosmos_proto.scalar) = "cosmos.Dec"];
  string certificate_serial = 7;
  string certificate_registry = 8;
  string vault_id = 9;
  string mcs_device_id = 10;
}

// DocumentHash links an IPFS document to a provenance record
message DocumentHash {
  string ipfs_hash = 1;
  string document_type = 2;
  string description = 3;
  google.protobuf.Timestamp uploaded_at = 4 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  uint64 file_size = 5;
  string mime_type = 6;
}

// CustodyEvent tracks a transfer in the chain of custody
message CustodyEvent {
  string from = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string to = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  google.protobuf.Timestamp timestamp = 3 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  string reason = 4;
  string tx_hash = 5;
}

// ProvenanceRecord is the immutable on-chain record linking a token to its energy source
message ProvenanceRecord {
  string record_id = 1;
  string certificate_id = 2;
  uint64 token_batch_start = 3;
  uint64 token_batch_end = 4;
  string provenance_type = 5;
  EnergySource energy_source = 6 [(gogoproto.nullable) = false];
  repeated DocumentHash document_hashes = 7 [(gogoproto.nullable) = false];
  google.protobuf.Timestamp created_at = 8 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  string created_by = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated CustodyEvent chain_of_custody = 10 [(gogoproto.nullable) = false];
}

// TokenLineage allows tracing a token back to the original energy source
message TokenLineage {
  uint64 token_id = 1;
  string current_owner = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string provenance_record_id = 3;
  string original_mint_tx = 4;
  repeated CustodyEvent transfer_history = 5 [(gogoproto.nullable) = false];
}

// Params defines the parameters for the provenance module
message Params {
  bool require_document_hash = 1;
  uint32 max_documents_per_record = 2;
  repeated string accepted_document_types = 3;
  repeated string accepted_energy_types = 4;
}

// GenesisState defines the provenance module's genesis state
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated ProvenanceRecord records = 2 [(gogoproto.nullable) = false];
}
