syntax = "proto3";
package ftgchain.energymint.v1;

option go_package = "github.com/VelaFlux28/ftg-chain/x/energymint/types";

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";

// Msg defines the energymint module's gRPC message service
service Msg {
  // MintFromCertificate mints new FTG tokens from a verified energy certificate
  rpc MintFromCertificate(MsgMintFromCertificate) returns (MsgMintFromCertificateResponse);

  // AddMinter adds an authorized minter address (governance only)
  rpc AddMinter(MsgAddMinter) returns (MsgAddMinterResponse);

  // RemoveMinter removes an authorized minter address (governance only)
  rpc RemoveMinter(MsgRemoveMinter) returns (MsgRemoveMinterResponse);
}

// MsgMintFromCertificate is the request to mint FTG tokens from an energy certificate
message MsgMintFromCertificate {
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string external_id = 2;
  string source = 3;
  string mwh_quantity = 4 [(cosmos_proto.scalar) = "cosmos.Dec"];
  google.protobuf.Timestamp generation_date = 5 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  google.protobuf.Timestamp purchase_date = 6 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
  string ipfs_hash = 7;
  string provenance_type = 8;
  string destination_wallet = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgMintFromCertificateResponse {
  string certificate_id = 1;
  string tokens_minted = 2 [(cosmos_proto.scalar) = "cosmos.Int"];
  string recipient = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgAddMinter adds an authorized minter address
message MsgAddMinter {
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string minter_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgAddMinterResponse {}

// MsgRemoveMinter removes an authorized minter address
message MsgRemoveMinter {
  option (gogoproto.equal) = false;
  option (gogoproto.goproto_getters) = false;

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string minter_address = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgRemoveMinterResponse {}
